[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "futurework"
version = "0.1.0"
description = "面向未来人机自然交互的全平台生产力工具对接核心"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "l1Ha" }]
keywords = ["multimodal", "human-computer-interaction", "voice", "gesture", "gaze", "agents", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-randomly>=3.0"]

[project.urls]
Homepage = "https://github.com/l1Ha/FutureWork"
Repository = "https://github.com/l1Ha/FutureWork"
Issues = "https://github.com/l1Ha/FutureWork/issues"

[project.scripts]
futurework = "futurework.cli:main"

[tool.setuptools.packages.find]
include = ["futurework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
