<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanPurple)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Orbital rings symbolizing multimodal perception channels -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="16 20" stroke-opacity="0.25"/>

  <!-- Core futuristic 'FW' neural interaction glyph -->
  <!-- Letter F -->
  <path d="M 160 140 L 290 140 C 310 140, 320 155, 310 175 C 300 195, 280 200, 260 200 L 205 200 L 195 240 L 250 240 C 270 240, 275 255, 265 275 C 255 290, 235 295, 215 295 L 180 295 L 140 372"
        fill="none" stroke="url(#cyanPurple)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Letter W overlapping / dynamic interaction wave -->
  <path d="M 230 372 L 270 230 L 320 340 L 370 230 L 410 372"
        fill="none" stroke="url(#glowGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Eye gaze / pointing interaction focal node -->
  <circle cx="370" cy="170" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="370" cy="170" r="28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="370" cy="170" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.4"/>
</svg>
